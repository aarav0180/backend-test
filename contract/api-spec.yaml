openapi: 3.1.0
info:
  title: Backend Comparison API
  version: 1.0.0
  description: The shared behavior contract for all six framework implementations.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
              example: { status: ok }
  /calculate:
    post:
      operationId: calculate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numbers]
              properties:
                numbers:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: integer
                    minimum: -1000000000
                    maximum: 1000000000
            example: { numbers: [4, 1, 7, 2] }
      responses:
        '200':
          description: Summary statistics for the supplied numbers.
          content:
            application/json:
              schema:
                type: object
                required: [count, sum, min, max, mean, median]
                properties:
                  count: { type: integer }
                  sum: { type: integer }
                  min: { type: integer }
                  max: { type: integer }
                  mean: { type: number }
                  median: { type: number }
              example: { count: 4, sum: 14, min: 1, max: 7, mean: 3.5, median: 3 }
        '400':
          description: Request body is not valid JSON or does not satisfy the input contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid_json:
                  value: { error: { code: invalid_json, message: Request body must be valid JSON. } }
                invalid_input:
                  value: { error: { code: invalid_input, message: numbers must be a non-empty array of at most 10000 integers between -1000000000 and 1000000000. } }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
